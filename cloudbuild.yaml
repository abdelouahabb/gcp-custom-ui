# ============================================================================
# CloudPulse 2026 — Official Google Cloud Build & Cloud Run Production Pipeline
# Execute directly:
#   gcloud builds submit --config=cloudbuild.yaml --substitutions=_REGION=us-central1
# ============================================================================
steps:
  # 1. Build multi-stage production image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-cloudpulse-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-cloudpulse-image'
    waitFor: ['build-cloudpulse-image']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}'

  # 3. Deploy to Cloud Run Gen2 with WebSocket session affinity & 2 vCPU / 2GiB RAM
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run-gen2'
    waitFor: ['push-cloudpulse-image']
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--execution-environment=gen2'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--session-affinity'
      - '--timeout=3600'
      - '--set-env-vars=NODE_ENV=production,CLOUDSDK_METRICS_ENVIRONMENT=datacloud.antigravity'
      - '--labels=managed_by=cloudpulse_2026,tier=executive_cockpit'
      - '--allow-unauthenticated'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'cloudpulse-containers'
  _SERVICE_NAME: 'cloudpulse-2026-cockpit'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest'
